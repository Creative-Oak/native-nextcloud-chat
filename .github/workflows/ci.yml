name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # The whole non-UI application builds and tests here, which is what keeps the layering
    # honest: if anything in Sources/TalkCore reaches for SwiftUI or AppKit, this fails.
    name: Core (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Check imports
        # A missing `import AppKit` in a SwiftUI file is invisible on Linux and an instant
        # error on a Mac, so it is worth checking where there is no Xcode to tell us.
        run: python3 Tools/check_imports.py
      - name: Validate the Xcode project
        # Parses project.pbxproj as an OpenStep plist and checks for the things that make
        # Xcode refuse to open a project. Runs on Linux, where there is no Xcode to ask.
        run: python3 Tools/validate_pbxproj.py Kvidr.xcodeproj/project.pbxproj
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Type check the app target
        # The app is type-checked against stand-in SwiftUI/AppKit modules (Tools/uicheck),
        # so a wrong argument label or an isolation mistake fails here rather than in the
        # macOS job ten minutes later.
        run: ./Tools/uicheck/run.sh

  app:
    name: App (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build the app
        run: >
          xcodebuild build
          -project Kvidr.xcodeproj
          -scheme Kvidr
          -configuration Debug
          -destination 'platform=macOS'
          -quiet
          CODE_SIGNING_ALLOWED=NO
      - name: Test the core package on macOS
        # Also compiles the SwiftData-backed code paths, which the Linux job skips.
        run: swift test
