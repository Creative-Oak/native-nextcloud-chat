name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Keep the core free of UI
        # On a Mac, SwiftUI and AppKit are always there to import, so no build fails when
        # Sources/TalkCore reaches for one. This is the check that does.
        run: ./Tools/check_core_layering.sh
      - name: Build the app
        run: >
          xcodebuild build
          -project Kvidr.xcodeproj
          -scheme Kvidr
          -configuration Debug
          -destination 'platform=macOS'
          -quiet
          CODE_SIGNING_ALLOWED=NO
      - name: Test the core package
        run: swift test
