name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # The whole non-UI application builds and tests here, which is what keeps the layering
    # honest: if anything in Sources/TalkCore reaches for SwiftUI or AppKit, this fails.
    name: Core (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Xcode project
        # Parses project.pbxproj as an OpenStep plist and checks for the things that make
        # Xcode refuse to open a project. Runs on Linux, where there is no Xcode to ask.
        run: python3 Tools/validate_pbxproj.py TalkForMac.xcodeproj/project.pbxproj
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  app:
    name: App (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build the app
        run: >
          xcodebuild build
          -project TalkForMac.xcodeproj
          -scheme TalkForMac
          -configuration Debug
          -destination 'platform=macOS'
          -quiet
          CODE_SIGNING_ALLOWED=NO
      - name: Test the core package on macOS
        # Also compiles the SwiftData-backed code paths, which the Linux job skips.
        run: swift test
